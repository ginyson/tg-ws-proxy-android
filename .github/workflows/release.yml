name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.12.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'malordin/tg-ws-proxy-android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check tag and application version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'val releaseVersionName = "([^"]+)"', Path('app/build.gradle.kts').read_text())[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match releaseVersionName'
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/tgwsproxy/go.mod
          cache-dependency-path: native/tgwsproxy/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r scripts/requirements-ci.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - name: Test native runtime
        working-directory: native/tgwsproxy
        run: go test ./...
      - name: Test Android code
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYSTORE_FILE: ${{ runner.temp }}/tgwsproxy-release.jks
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify and package release
        run: |
          apk="TgWsProxy-Android-$RELEASE_TAG-arm64-v8a.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
      - name: Publish APK and SHA-256 to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 \
            --verify-tag --title "TgWsProxy SNI $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
